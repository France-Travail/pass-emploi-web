version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: '07:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 20
    commit-message:
      prefix: 'chore(deps):'
    # Laisse à la communauté le temps de repérer une version compromise, plus longtemps pour une majeure.
    # Ne s'applique pas aux security updates.
    cooldown:
      default-days: 3
      semver-major-days: 14
    ignore:
      # La majeure de @types/node suit celle de Node en prod, montée à la main avec le runtime.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      next:
        applies-to: version-updates
        update-types:
          - patch
          - minor
        patterns:
          - 'next'
          - 'next-*'
          - '@next/*'
          - 'eslint-config-next'
      next-major:
        applies-to: version-updates
        update-types:
          - major
        patterns:
          - 'next'
          - 'next-*'
          - '@next/*'
          - 'eslint-config-next'
      eslint:
        applies-to: version-updates
        update-types:
          - patch
          - minor
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - '@typescript-eslint/*'
          - 'prettier'
        exclude-patterns:
          - 'eslint-config-next'
      eslint-major:
        applies-to: version-updates
        update-types:
          - major
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - '@typescript-eslint/*'
          - 'prettier'
        exclude-patterns:
          - 'eslint-config-next'
      react:
        applies-to: version-updates
        update-types:
          - patch
          - minor
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      react-major:
        applies-to: version-updates
        update-types:
          - major
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      testing:
        applies-to: version-updates
        update-types:
          - patch
          - minor
        patterns:
          - 'jest*'
          - '@testing-library/*'
          - '@types/jest*'
      testing-major:
        applies-to: version-updates
        update-types:
          - major
        patterns:
          - 'jest*'
          - '@testing-library/*'
          - '@types/jest*'
      elastic-apm:
        applies-to: version-updates
        update-types:
          - patch
          - minor
        patterns:
          - '@elastic/*'
          - 'elastic-apm-*'
      elastic-apm-major:
        applies-to: version-updates
        update-types:
          - major
        patterns:
          - '@elastic/*'
          - 'elastic-apm-*'
      tailwind-css:
        applies-to: version-updates
        update-types:
          - patch
          - minor
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'postcss'
      tailwind-css-major:
        applies-to: version-updates
        update-types:
          - major
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'postcss'
      pino:
        applies-to: version-updates
        update-types:
          - patch
          - minor
        patterns:
          - 'pino'
          - 'pino-*'
          - '@types/pino*'
      pino-major:
        applies-to: version-updates
        update-types:
          - major
        patterns:
          - 'pino'
          - 'pino-*'
          - '@types/pino*'
      # Dependabot range une dépendance dans le groupe le plus « spécifique », pas dans le premier déclaré :
      # sans ces exclusions, un groupe sans `patterns` l'emporte sur un motif à joker comme `@nestjs/*`.
      prod-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - patch
          - minor
        exclude-patterns:
          - 'next'
          - 'next-*'
          - '@next/*'
          - 'eslint-config-next'
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - '@typescript-eslint/*'
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
          - 'jest*'
          - '@testing-library/*'
          - '@types/jest*'
          - '@elastic/*'
          - 'elastic-apm-*'
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'postcss'
          - 'prettier'
          - 'pino'
          - 'pino-*'
          - '@types/pino*'
      prod-major:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - major
        exclude-patterns:
          - 'next'
          - 'next-*'
          - '@next/*'
          - 'eslint-config-next'
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - '@typescript-eslint/*'
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
          - 'jest*'
          - '@testing-library/*'
          - '@types/jest*'
          - '@elastic/*'
          - 'elastic-apm-*'
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'postcss'
          - 'prettier'
          - 'pino'
          - 'pino-*'
          - '@types/pino*'
      dev-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - patch
          - minor
        exclude-patterns:
          - 'next'
          - 'next-*'
          - '@next/*'
          - 'eslint-config-next'
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - '@typescript-eslint/*'
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
          - 'jest*'
          - '@testing-library/*'
          - '@types/jest*'
          - '@elastic/*'
          - 'elastic-apm-*'
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'postcss'
          - 'prettier'
          - 'pino'
          - 'pino-*'
          - '@types/pino*'
      dev-major:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - major
        exclude-patterns:
          - 'next'
          - 'next-*'
          - '@next/*'
          - 'eslint-config-next'
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - '@typescript-eslint/*'
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
          - 'jest*'
          - '@testing-library/*'
          - '@types/jest*'
          - '@elastic/*'
          - 'elastic-apm-*'
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'postcss'
          - 'prettier'
          - 'pino'
          - 'pino-*'
          - '@types/pino*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: '07:00'
      timezone: Europe/Paris
    commit-message:
      prefix: 'ci(deps):'
    cooldown:
      default-days: 3
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - patch
          - minor
      actions-major:
        applies-to: version-updates
        update-types:
          - major
