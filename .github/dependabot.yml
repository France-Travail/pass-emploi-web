version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: '07:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 15
    commit-message:
      prefix: 'chore(deps):'
    # Majeures npm montées hors Dependabot : elles demandent souvent une refacto.
    # Sans effet sur les security updates, créées quel que soit le type de montée.
    allow:
      - dependency-type: direct
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
    # Laisse à la communauté le temps de repérer une version compromise. Ne s'applique pas aux security updates.
    cooldown:
      default-days: 3
    groups:
      next:
        applies-to: version-updates
        patterns:
          - 'next'
          - 'next-*'
          - '@next/*'
          - 'eslint-config-next'
      eslint:
        applies-to: version-updates
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - '@typescript-eslint/*'
      react:
        applies-to: version-updates
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      testing:
        applies-to: version-updates
        patterns:
          - 'jest*'
          - '@testing-library/*'
          - '@types/jest*'
      elastic-apm:
        applies-to: version-updates
        patterns:
          - '@elastic/*'
          - 'elastic-apm-*'
      tailwind-css:
        applies-to: version-updates
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'postcss'
      # Dependabot range une dépendance dans le groupe le plus « spécifique », pas dans le premier déclaré :
      # sans ces exclusions, un groupe sans `patterns` l'emporte sur un motif à joker comme `@nestjs/*`.
      prod-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - patch
          - minor
        exclude-patterns:
          - 'next'
          - 'next-*'
          - '@next/*'
          - 'eslint-config-next'
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - '@typescript-eslint/*'
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
          - 'jest*'
          - '@testing-library/*'
          - '@types/jest*'
          - '@elastic/*'
          - 'elastic-apm-*'
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'postcss'
      dev-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - patch
          - minor
        exclude-patterns:
          - 'next'
          - 'next-*'
          - '@next/*'
          - 'eslint-config-next'
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - '@typescript-eslint/*'
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
          - 'jest*'
          - '@testing-library/*'
          - '@types/jest*'
          - '@elastic/*'
          - 'elastic-apm-*'
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'postcss'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: '07:00'
      timezone: Europe/Paris
    commit-message:
      prefix: 'ci(deps):'
    cooldown:
      default-days: 3
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - patch
          - minor
